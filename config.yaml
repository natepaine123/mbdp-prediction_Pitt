data:
  train_path: "data/processed/train.csv"
  target_column: "mbdp"
  test_size: 0.2
  random_state: 42

# Only features actually present in the real data.
feature_columns:
  - ga
  - bw
  - sga
  - sex
  - last_alp
  - last_phosphate
  - cum_pn_days

model:
  type: "logistic_regression"
  max_iter: 1000
  class_weight: "balanced"    # 11% prevalence → needed
  random_state: 42